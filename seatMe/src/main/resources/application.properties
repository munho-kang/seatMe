spring.application.name=seatMe

# 인증키는 seatMe/.env.local 파일에 "MOLIT_SERVICE_KEY=발급받은키" 한 줄로 넣는다 (저장소에 안 올라감).
# 같은 이름의 환경 변수로 주면 파일보다 우선한다 (배포할 때).
spring.config.import=optional:file:./.env.local[.properties]

# 국토교통부(TAGO) 국내항공운항정보 — https://www.data.go.kr/data/15098526/openapi.do
seatme.molit.base-url=https://apis.data.go.kr/1613000/DmstcFlightNvgInfo
seatme.molit.service-key=${MOLIT_SERVICE_KEY:}
# 국토부가 이 시간 안에 답하지 않으면 포기하고 502 (명세서: 5초)
seatme.molit.timeout-ms=5000

# 한국공항공사 기종 API
kac.api.base-url=https://apis.data.go.kr/B551178/flight-aircraft-status/info
kac.api.service-key=${KAC_API_KEY:}
